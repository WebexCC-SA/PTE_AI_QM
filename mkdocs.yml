---
site_name: "Collab PTE 2026: Mastering Cisco Native Workforce Engagement Management" # This must begin with the session ID, e.g. LABXXX-1234 This is my Cisco Live Lab
site_description: "Collab PTE 2026: Mastering Cisco Native Workforce Engagement Management" # must be same as "site_name"
site_author: Mykola Danylchuk
copyright: Copyright &copy; 2026 Cisco
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.integrate
  custom_dir: docs/overrides
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: template_assets/webexLogo91.png
  favicon: template_assets/webex75.png
extra:
  generator: false
  repo: "https://github.com/WebexCC-SA/LAB-21109.git"
  site_event: test
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - template_assets/js/newLoad.js
  - template_assets/js/setInfo.js
  - template_assets/js/credentials.js
plugins:
  - search
  - macros
  # - with-pdf:
  #     cover_title: LABXXX-1234
  #     cover_subtitle: My famous WebexOne Lab
  #     cover_logo: template_assets/wx1Splash_new.gif
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
      - custom-skip-class-name
      auto_caption: true
      caption_position: top
markdown_extensions:
  - md_in_html
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
      
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  # - Welcome: welcome.md
  - Getting Started:
      - Lab Overview: ./main/overview.md
      - Lab Environment: ./main/PreRequisites.md
  - AI QM:
      - Quality Managment:
          - Lab Guide:
              - "Lab overview": ./main/AI_Lab_QM_Overview.md
              - "Mission 1: Configure Evaluation of human agent's answers": ./main/AI_Lab_QM_Mission1.md
              - "Mission 2: Configure Evaluation of AI Agent's answers": ./main/AI_Lab_QM_Mission2.md
              - "Mission 3: Configure Coaching Insights": ./main/AI_Lab_QM_Mission3.md
          - Conclusion: ./main/AI_Lab_SupervisorAI_Conclusion.md
